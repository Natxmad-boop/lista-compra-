<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#16a34a" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-title" content="La Compra" />
<title>La Compra</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--text:#111827;--muted:#6b7280;--accent:#16a34a;--accent-2:#15803d;--accent-soft:#dcfce7;--pending-bg:#fffbeb;--pending-border:#fde68a;--pending-text:#92400e;--danger:#dc2626;--border:#e5e7eb;--shadow:0 1px 3px rgba(0,0,0,.06),0 1px 2px rgba(0,0,0,.04);--shadow-lg:0 10px 25px rgba(0,0,0,.08)}
@media (prefers-color-scheme: dark){:root{--bg:#0f172a;--card:#1e293b;--text:#f1f5f9;--muted:#94a3b8;--accent:#22c55e;--accent-2:#16a34a;--accent-soft:#14532d;--pending-bg:#422006;--pending-border:#854d0e;--pending-text:#fbbf24;--border:#334155}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;font-size:16px;line-height:1.4;transition:background .2s,color .2s}
.topbar{position:sticky;top:0;z-index:20;background:linear-gradient(135deg,#16a34a,#15803d);color:#fff;padding:14px 16px calc(14px + env(safe-area-inset-top,0px));padding-top:calc(14px + env(safe-area-inset-top,0px));box-shadow:0 2px 12px rgba(0,0,0,.15)}
.topbar-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.logo{display:flex;align-items:center;gap:10px}
.logo-icon{width:38px;height:38px;background:rgba(255,255,255,.18);border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:22px;backdrop-filter:blur(4px)}
.logo-text h1{margin:0;font-size:18px;font-weight:700;letter-spacing:-.3px}
.logo-text p{margin:0;font-size:12px;opacity:.85}
.counter-pill{background:rgba(255,255,255,.2);color:#fff;font-size:13px;font-weight:600;padding:6px 12px;border-radius:999px;backdrop-filter:blur(4px);white-space:nowrap}
.search-wrap{position:relative}
.search-wrap svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:18px;height:18px;color:#6b7280;pointer-events:none}
.search-wrap input{width:100%;padding:11px 12px 11px 40px;border-radius:12px;border:none;font-size:16px;outline:none;background:rgba(255,255,255,.97);color:#111}
main{padding:14px;max-width:720px;margin:0 auto;padding-bottom:110px}
.section-card{background:var(--card);border-radius:16px;padding:14px 16px;margin-bottom:14px;box-shadow:var(--shadow);border:1px solid var(--border)}
.section-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;gap:10px}
.section-title{display:flex;align-items:center;gap:8px;font-size:15px;font-weight:700;letter-spacing:.2px;color:var(--text);text-transform:uppercase;margin:0}
.section-title .icon{font-size:18px}
.section-count{background:var(--accent-soft);color:var(--accent-2);font-size:12px;font-weight:700;padding:3px 10px;border-radius:999px}
.pending-card{background:var(--pending-bg);border:1px solid var(--pending-border)}
.pending-card .section-title{color:var(--pending-text)}
.pending-card .section-count{background:rgba(146,64,14,.12);color:var(--pending-text)}
.pending-card .cat-header{color:var(--pending-text)}
.btn-share{background:rgba(255,255,255,.85);color:var(--accent-2);border:none;border-radius:10px;padding:8px 12px;font-size:13px;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.btn-share:active{background:#fff}
.btn-clear{background:transparent;border:1.5px solid var(--danger);color:var(--danger);border-radius:10px;padding:7px 12px;font-size:13px;font-weight:600;cursor:pointer}
.category{background:var(--card);border-radius:16px;margin-bottom:14px;overflow:hidden;box-shadow:var(--shadow);border:1px solid var(--border)}
.cat-header{display:flex;align-items:center;gap:10px;padding:12px 16px;background:linear-gradient(180deg,rgba(0,0,0,.02),transparent);border-bottom:1px solid var(--border)}
.cat-icon{font-size:20px;width:32px;height:32px;display:flex;align-items:center;justify-content:center;background:var(--accent-soft);border-radius:10px}
.cat-name{font-size:14px;font-weight:700;letter-spacing:.3px;flex:1;text-transform:uppercase;color:var(--text)}
.cat-count{font-size:12px;color:var(--muted);font-weight:600}
.list{list-style:none;margin:0;padding:0}
.item{display:flex;align-items:center;gap:12px;padding:13px 16px;border-bottom:1px solid var(--border);cursor:pointer;user-select:none;transition:background .15s}
.item:last-child{border-bottom:none}
.item:active{background:rgba(0,0,0,.03)}
.item input[type=checkbox]{appearance:none;-webkit-appearance:none;width:26px;height:26px;border:2px solid #cbd5e1;border-radius:8px;flex:0 0 auto;position:relative;cursor:pointer;transition:all .18s;background:var(--card)}
.item input[type=checkbox]:checked{background:var(--accent);border-color:var(--accent);transform:scale(1.05)}
.item input[type=checkbox]:checked::after{content:"";position:absolute;left:8px;top:3px;width:6px;height:12px;border:solid #fff;border-width:0 2.5px 2.5px 0;transform:rotate(45deg)}
.item .name{flex:1;font-size:16px;font-weight:500}
.item.checked .name{color:var(--muted)}
.item .mini-cat{font-size:15px;opacity:.55;margin-right:2px}
.item .delete-btn{background:transparent;border:none;color:var(--danger);font-size:22px;padding:4px 8px;cursor:pointer;line-height:1;opacity:.4;font-weight:400}
.item .delete-btn:active{opacity:1}
.empty{color:var(--muted);font-size:14px;padding:12px 4px;text-align:center}
.pending-empty{color:var(--pending-text);font-size:14px;padding:14px 4px;text-align:center;opacity:.8}
/* FAB */
.fab{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));right:20px;width:60px;height:60px;border-radius:50%;background:linear-gradient(135deg,#16a34a,#15803d);color:#fff;border:none;font-size:32px;font-weight:300;box-shadow:var(--shadow-lg);cursor:pointer;z-index:30;display:flex;align-items:center;justify-content:center;line-height:1;transition:transform .15s}
.fab:active{transform:scale(.92)}
/* Modal */
.modal-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:40;display:none;align-items:flex-end;justify-content:center;animation:fadeIn .2s}
.modal-backdrop.show{display:flex}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.modal{background:var(--card);border-radius:20px 20px 0 0;padding:20px 20px calc(24px + env(safe-area-inset-bottom,0px));width:100%;max-width:520px;animation:slideUp .25s ease-out}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
.modal h2{margin:0 0 16px;font-size:18px;font-weight:700}
.modal label{display:block;font-size:13px;font-weight:600;color:var(--muted);margin-bottom:6px;text-transform:uppercase;letter-spacing:.3px}
.modal input,.modal select{width:100%;padding:13px 14px;border-radius:12px;border:1.5px solid var(--border);font-size:16px;background:var(--bg);color:var(--text);margin-bottom:14px;outline:none}
.modal input:focus,.modal select:focus{border-color:var(--accent)}
.modal-actions{display:flex;gap:10px;margin-top:6px}
.modal-actions button{flex:1;padding:14px;border-radius:12px;border:none;font-size:16px;font-weight:700;cursor:pointer}
.btn-cancel{background:var(--bg);color:var(--text);border:1.5px solid var(--border)!important}
.btn-primary{background:linear-gradient(135deg,#16a34a,#15803d);color:#fff}
.toast{position:fixed;bottom:100px;left:50%;transform:translateX(-50%) translateY(80px);background:rgba(17,24,39,.92);color:#fff;padding:12px 20px;border-radius:24px;font-size:14px;font-weight:500;opacity:0;transition:all .3s;pointer-events:none;z-index:60;backdrop-filter:blur(6px);max-width:90vw;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.hidden{display:none!important}
.footer-note{text-align:center;color:var(--muted);font-size:12px;margin-top:20px;padding-bottom:10px}
</style>
</head>
<body>
<header class="topbar">
  <div class="topbar-top">
    <div class="logo">
      <div class="logo-icon">🛒</div>
      <div class="logo-text">
        <h1>La Compra</h1>
        <p>Lista compartida</p>
      </div>
    </div>
    <div class="counter-pill" id="header-counter">0 en la lista</div>
  </div>
  <div class="search-wrap">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
    <input id="search" type="search" placeholder="Buscar en el catálogo..." autocomplete="off" />
  </div>
</header>

<main>
  <section class="section-card pending-card hidden" id="pending-section">
    <div class="section-head">
      <h2 class="section-title"><span class="icon">🛍️</span> Para comprar <span class="section-count" id="pending-count">0</span></h2>
      <button class="btn-clear" id="clear-pending">Vaciar</button>
    </div>
    <div id="pending-content"></div>
  </section>

  <div id="catalog"></div>

  <p class="footer-note">La Compra · Hecha con cariño</p>
</main>

<button class="fab" id="fab-add" aria-label="Añadir artículo">+</button>

<div class="modal-backdrop" id="modal-backdrop">
  <div class="modal">
    <h2>Añadir artículo</h2>
    <label for="new-name">Nombre</label>
    <input id="new-name" type="text" placeholder="Ej: Leche de avena" autocomplete="off" />
    <label for="new-category">Categoría</label>
    <select id="new-category"></select>
    <div class="modal-actions">
      <button class="btn-cancel" id="modal-cancel">Cancelar</button>
      <button class="btn-primary" id="modal-save">Añadir</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const CATALOGO_INICIAL={"Carne y pescado":["Filete ternera","Ternera","Solomillo pavo","Pechuga pollo","Carne guisar","Costilla","Pollo (alitas)","Muslos pollo o pavo","Chorizo cocinar","Bacon","Jamón serrano","Tacos jamón","Cinta de lomo","Paté","Hamburguesa pollo o pavo","Fuet","Caballa","Salmón","Merluza","Pescado","Bacalao","Gulas"],"Lácteos":["Leche","Leche sin lactosa","Queso","Queso untar","Queso sándwich","Yogur","Petit suisse","Nata","Nata cocinar","Colacao"],"Fruta y verdura":["Zanahorias","Kiwis","Manzanas","Plátanos","Peras","Piña","Limones","Fresas","Uvas","Pepino","Champiñones","Judías verdes","Espinacas congeladas","Guisantes","Judías pintas"],"Despensa":["Pasta","Pasta fresca","Arroz","Arroz congelado","Arroz precocinado","Café","Pipas","Garbanzos","Harina","Azúcar","Aceitera","Vinagre espeso","Salsa soja","Mayonesa","Tomate frito","Mermelada","Ketchup","Laurel","Perejil","Pastilla avecrem","Menestra","Puré patata","Masa pizza o hojaldre","Galletas","Pan tostado","Empanada","Fajitas","Macarrones","Espaguetis","Palitos cangrejo","Gazpacho"],"Bebidas":["Agua","Vino","Cervezas sin alcohol"]};
const CAT_ICONS={"Carne y pescado":"🥩","Lácteos":"🥛","Fruta y verdura":"🥬","Despensa":"🥫","Bebidas":"🥤"};
const CATEGORIAS=Object.keys(CATALOGO_INICIAL);
const ORDEN_CAT=new Map(CATEGORIAS.map((c,i)=>[c,i]));
const STORAGE_KEY="lista_compra_v2";
let items=[];let filterText="";
const $=(s)=>document.querySelector(s);
function slugId(s){return s.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"")}
function loadItems(){try{const r=localStorage.getItem(STORAGE_KEY);if(r)return JSON.parse(r)}catch(e){}return null}
function saveItems(){try{localStorage.setItem(STORAGE_KEY,JSON.stringify(items))}catch(e){}}
function seedIfEmpty(){const l=loadItems();if(l)return l;const s=[];let o=0;for(const[cat,nombres]of Object.entries(CATALOGO_INICIAL)){for(const n of nombres){s.push({id:slugId(n),nombre:n,categoria:cat,marcado:false,orden:o++})}}return s}
function catIcon(cat){return CAT_ICONS[cat]||"📦"}
function render(){renderHeader();renderPending();renderCatalog();renderCategoryOptions()}
function renderHeader(){const p=items.filter(i=>i.marcado).length;const el=$("#header-counter");el.textContent=p===0?"Vacía":p===1?"1 en la lista":p+" en la lista"}
function renderPending(){const sec=$("#pending-section");const cont=$("#pending-content");const count=$("#pending-count");const p=items.filter(i=>i.marcado);if(p.length===0){sec.classList.add("hidden");return}sec.classList.remove("hidden");count.textContent=p.length;const groups=new Map();for(const it of p){if(!groups.has(it.categoria))groups.set(it.categoria,[]);groups.get(it.categoria).push(it)}const cats=[...groups.keys()].sort((a,b)=>(ORDEN_CAT.get(a)??999)-(ORDEN_CAT.get(b)??999)||a.localeCompare(b,"es"));cont.innerHTML="";for(const cat of cats){const h=document.createElement("div");h.className="cat-header";h.innerHTML='<div class="cat-icon">'+catIcon(cat)+'</div><div class="cat-name">'+cat+'</div><div class="cat-count">'+groups.get(cat).length+'</div>';cont.appendChild(h);const ul=document.createElement("ul");ul.className="list";groups.get(cat).sort((a,b)=>a.nombre.localeCompare(b.nombre,"es")).forEach(it=>ul.appendChild(renderItem(it,false)));cont.appendChild(ul)}}
function renderCatalog(){const cont=$("#catalog");cont.innerHTML="";const q=filterText.trim().toLowerCase();const groups=new Map();for(const it of items){if(q&&!it.nombre.toLowerCase().includes(q))continue;if(!groups.has(it.categoria))groups.set(it.categoria,[]);groups.get(it.categoria).push(it)}const cats=[...groups.keys()].sort((a,b)=>(ORDEN_CAT.get(a)??999)-(ORDEN_CAT.get(b)??999)||a.localeCompare(b,"es"));if(cats.length===0){const e=document.createElement("div");e.className="section-card empty";e.textContent=q?"Sin resultados para \""+filterText+"\"":"No hay artículos";cont.appendChild(e);return}for(const cat of cats){const card=document.createElement("div");card.className="category";const head=document.createElement("div");head.className="cat-header";const marcados=groups.get(cat).filter(i=>i.marcado).length;head.innerHTML='<div class="cat-icon">'+catIcon(cat)+'</div><div class="cat-name">'+cat+'</div><div class="cat-count">'+marcados+'/'+groups.get(cat).length+'</div>';card.appendChild(head);const ul=document.createElement("ul");ul.className="list";groups.get(cat).sort((a,b)=>(a.orden??0)-(b.orden??0)||a.nombre.localeCompare(b.nombre,"es")).forEach(it=>ul.appendChild(renderItem(it,true)));card.appendChild(ul);cont.appendChild(card)}}
function renderItem(item,showDelete){const li=document.createElement("li");li.className="item"+(item.marcado?" checked":"");const cb=document.createElement("input");cb.type="checkbox";cb.checked=!!item.marcado;cb.addEventListener("change",()=>toggleItem(item.id,cb.checked));const name=document.createElement("span");name.className="name";name.textContent=item.nombre;name.addEventListener("click",(e)=>{e.preventDefault();cb.checked=!cb.checked;toggleItem(item.id,cb.checked)});li.appendChild(cb);li.appendChild(name);if(showDelete){const del=document.createElement("button");del.className="delete-btn";del.title="Eliminar del catálogo";del.textContent="×";del.addEventListener("click",(e)=>{e.stopPropagation();deleteItem(item.id)});li.appendChild(del)}return li}
function renderCategoryOptions(){const sel=$("#new-category");sel.innerHTML="";for(const cat of CATEGORIAS){const o=document.createElement("option");o.value=cat;o.textContent=catIcon(cat)+" "+cat;sel.appendChild(o)}const otra=document.createElement("option");otra.value="__nueva__";otra.textContent="➕ Nueva categoría...";sel.appendChild(otra)}
function toggleItem(id,marcado){const it=items.find(x=>x.id===id);if(!it)return;it.marcado=marcado;saveItems();render()}
function deleteItem(id){const it=items.find(x=>x.id===id);if(!it)return;if(!confirm('¿Eliminar "'+it.nombre+'" del catálogo?'))return;items=items.filter(x=>x.id!==id);saveItems();render();toast("Eliminado")}
function addNewItem(nombre,categoria){const id=slugId(nombre)+"-"+Math.random().toString(36).slice(2,6);const orden=10000+Date.now()%100000;items.push({id,nombre:nombre.trim(),categoria:categoria.trim(),marcado:true,orden});saveItems();render()}
function clearPending(){const p=items.filter(i=>i.marcado);if(!p.length)return;if(!confirm("¿Vaciar la lista? Se desmarcarán "+p.length+" artículo(s)."))return;items.forEach(i=>i.marcado=false);saveItems();render();toast("Lista vaciada ✓")}
function shareList(){const p=items.filter(i=>i.marcado);if(!p.length){toast("La lista está vacía");return}const groups=new Map();for(const it of p){if(!groups.has(it.categoria))groups.set(it.categoria,[]);groups.get(it.categoria).push(it)}const cats=[...groups.keys()].sort((a,b)=>(ORDEN_CAT.get(a)??999)-(ORDEN_CAT.get(b)??999));let txt="🛒 *La Compra*\n\n";for(const cat of cats){txt+=catIcon(cat)+" *"+cat+"*\n";groups.get(cat).sort((a,b)=>a.nombre.localeCompare(b.nombre,"es")).forEach(it=>{txt+="• "+it.nombre+"\n"});txt+="\n"}txt+="_"+p.length+" artículo"+(p.length===1?"":"s")+"_";if(navigator.share){navigator.share({text:txt}).catch(()=>{})}else{navigator.clipboard.writeText(txt).then(()=>toast("Copiado al portapapeles ✓")).catch(()=>{prompt("Copia la lista:",txt)})}}
function openModal(){$("#modal-backdrop").classList.add("show");setTimeout(()=>$("#new-name").focus(),100)}
function closeModal(){$("#modal-backdrop").classList.remove("show");$("#new-name").value=""}
function saveFromModal(){const nombre=$("#new-name").value.trim();let categoria=$("#new-category").value;if(!nombre){toast("Escribe un nombre");return}if(categoria==="__nueva__"){const n=prompt("Nombre de la nueva categoría:");if(!n||!n.trim())return;categoria=n.trim()}addNewItem(nombre,categoria);closeModal();toast("Añadido ✓")}
function setupUI(){$("#search").addEventListener("input",(e)=>{filterText=e.target.value;renderCatalog()});$("#clear-pending").addEventListener("click",clearPending);$("#fab-add").addEventListener("click",openModal);$("#modal-cancel").addEventListener("click",closeModal);$("#modal-save").addEventListener("click",saveFromModal);$("#modal-backdrop").addEventListener("click",(e)=>{if(e.target.id==="modal-backdrop")closeModal()});$("#new-name").addEventListener("keydown",(e)=>{if(e.key==="Enter")saveFromModal()});const shareBtn=document.createElement("button");shareBtn.className="btn-share";shareBtn.innerHTML="📤 Compartir";shareBtn.addEventListener("click",shareList);$("#pending-section").querySelector(".section-head").appendChild(shareBtn)}
let toastTimer;function toast(msg){const el=$("#toast");el.textContent=msg;el.classList.add("show");clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove("show"),1800)}
(function init(){setupUI();items=seedIfEmpty();saveItems();render()})();
</script>
</body>
</html>
